%% ir_version: 1.0

flowchart TD

  START(["START"])

<script type="application/json" id="diagram">"%% gebra display: workflow definition as Mermaid (DIAGRAM-STYLE-GUIDE)\n%% subject: fail.ir.yaml (ir-document)\n%% ir_version: 1.0\n%% overlay: run report for graph_version sha256:32b0b9dc8aaa0184... - gate: fail (exit 1)\n%% overlay counts: fatal 1, error 1, warning 0\nflowchart TD\n\n  START([\"START\"])\n  n_compose_5fmessage[\"compose_message\"]\n  n_send_5fsms[\"send_sms [F2]\"]\n  n_verify_5fdelivery[\"verify_delivery\"]\n  n_log_5freceipt[\"log_receipt\"]\n  END([\"END\"])\n\n  START --> n_compose_5fmessage\n  n_log_5freceipt --> END\n  n_compose_5fmessage --> n_send_5fsms\n  n_send_5fsms -->|\"[F1]\"| n_verify_5fdelivery\n  n_verify_5fdelivery -->|\"retry [F1]\"| n_send_5fsms\n  n_verify_5fdelivery -->|\"done\"| n_log_5freceipt\n\n  subgraph gebra_findings[\"gebra findings overlay\"]\n    f_1[\"F1 fatal [defensible] cycle-without-termination-witness - component send_sms, verify_delivery\"]\n    f_2[\"F2 error [defensible-a] unprotected-effect-in-retry-region - node send_sms\"]\n  end\n\n  classDef gebra_fatal fill:#dc2626,stroke:#7f1d1d,color:#ffffff\n  classDef gebra_error fill:#fecaca,stroke:#dc2626,color:#7f1d1d\n  classDef gebra_sentinel fill:#f3f4f6,stroke:#374151,color:#111827\n  class f_1 gebra_fatal\n  class n_send_5fsms,f_2 gebra_error\n  class START,END gebra_sentinel\n  linkStyle 3 stroke:#7f1d1d,stroke-width:3px\n  linkStyle 4 stroke:#7f1d1d,stroke-width:3px\n"</script>
<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.esm.min.mjs";

const text = JSON.parse(document.getElementById("diagram").textContent);
const view = document.getElementById("diagram-view");
mermaid.initialize({ startOnLoad: false });
try {
  const { svg } = await mermaid.render("gebra-diagram-svg", text);
  view.innerHTML = svg;
} catch (error) {
  const fallback = document.createElement("pre");
  fallback.textContent = "mermaid could not render this diagram: " + error + "\n\n" + text;
  view.replaceChildren(fallback);
}
</script>
