# Fixture: graph-well-formed / positive-01
# Schema: fixtures/properties/schema.yaml ($id: gebra-property-fixture-v2)

property: graph-well-formed
polarity: positive
description: >
  A strictly linear document-processing pipeline (ingest -> extract ->
  summarize -> archive) satisfying all four P-01 conditions: every node is
  reachable from START via the single chain; the only sink node
  (archive_summary) is wired to END; every node participates in at least
  one edge; and every edge target names an existing node. The minimal
  well-formed topology — no branching, no cycles, no path_map.

ir:
  ir_version: "1.0"
  entry: ingest_document
  finish: archive_summary
  state:
    document_url:
      type: str
      optional: true       # graph input; treated as written at START
    document: str
    text: str
    summary: str
    archive_id: str
  nodes:
    - id: ingest_document
      annotations:
        effect: [network]
        idempotent: { key: document_url }
        input: [document_url]
        output: [document]
    - id: extract_text
      annotations:
        pure: true
        input: [document]
        output: [text]
    - id: summarize_text
      annotations:
        idempotent: { key: text }
        input: [text]
        output: [summary]
    - id: archive_summary
      annotations:
        effect: [write]
        idempotent: { key: summary }
        input: [summary]
        output: [archive_id]
  edges:
    - from: ingest_document
      to: extract_text
    - from: extract_text
      to: summarize_text
    - from: summarize_text
      to: archive_summary

expected:
  result: pass
  witness:
    kind: well-formedness
    reachable_from_start: [archive_summary, extract_text, ingest_document, summarize_text]
    terminal_nodes: [archive_summary]
    orphan_nodes: []
    unresolved_targets: []

notes: >
  Witness/failure shape conforms to PROPERTY-CATALOG-SPEC (wedge five
  pinned 2026-07-18, DEC-11). One structured entry per formal condition —
  (i) reachable_from_start, (ii) terminal_nodes all in finish, (iii)
  orphan_nodes empty, (iv) unresolved_targets empty; node lists in the
  ledger-section-6 UTF-16 code-unit sorted order. Corpus
  discipline: every other catalog property holds — the graph is acyclic
  (P-02 vacuous), all declared reads/writes are state keys (P-03), every
  read is written upstream or at START (P-04), effects are keyed-idempotent
  on declared inputs (P-06/P-07), and no determinism or parallelism is
  claimed (P-08/P-09). Counterpart negatives: negative-01..03.
