# Gebra property fixture (gebra-property-fixture-v2) — authored by fixture-author, 2026-07-17.
property: signature-soundness
polarity: negative
description: >
  book_hotel declares writes {hotel_confirmation, hotel_voucher_url},
  but Sigma declares only hotel_confirmation -- hotel_voucher_url is an
  undeclared write target, violating writes(n) subset-of keys(Sigma).
  In LangGraph terms the node returns a key its state TypedDict lacks,
  so the value would be silently dropped at runtime; P-03 surfaces the
  dropped write at design time.
ir:
  ir_version: "1.0"
  entry: search_hotels
  finish: send_confirmation
  state:
    request: { type: str, optional: true }
    hotel_option: str
    hotel_confirmation: str
    confirmation: str
  nodes:
    - id: search_hotels
      annotations:
        effect: [network]
        input: [request]
        output: [hotel_option]
    - id: book_hotel
      annotations:
        effect: [irreversible, billable]
        idempotent: { key: hotel_option }
        input: [hotel_option]
        output: [hotel_confirmation, hotel_voucher_url]
    - id: send_confirmation
      annotations:
        effect: [network]
        input: [hotel_confirmation]
        output: [confirmation]
  edges:
    - from: search_hotels
      to: book_hotel
    - from: book_hotel
      to: send_confirmation
expected:
  result: fail
  failure:
    property_condition: "write-key-not-in-state-schema"
    location:
      node: book_hotel
      key: hotel_voucher_url
      annotation: output
    sigma_keys: [request, hotel_option, hotel_confirmation, confirmation]
notes: >
  Fails only P-03: no node reads hotel_voucher_url, so P-04 is
  untouched; the graph is a well-formed acyclic chain (P-01 holds, P-02
  vacuous); book_hotel is effectful but sits in no cycle and pins its
  idempotency key to a declared read (P-06, P-07). The
  silently-dropped-write hazard is the practical motivation for the
  writes-subset condition of D-010.
